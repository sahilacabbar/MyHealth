
name: Build My Health APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q MyHealth-Cloud-Build.zip -d source
          find source -maxdepth 4 -type f | head -100

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK
        run: |
          sdkmanager 'platforms;android-35' 'platforms;android-36' 'build-tools;35.0.0' 'build-tools;36.0.0'

      - name: Build APK
        run: |
          FILE=$(find source -name gradlew -type f | head -1)
          if [ -n "$FILE" ]; then
            cd "$(dirname "$FILE")"
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "Gradle wrapper tapılmadı"
            exit 1
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MyHealth-APK
          path: source/**/build/outputs/apk/debug/*.apk
